name: Attribution

# Commits and pull requests credit no AI coding agent
# (scripts/check-attribution). Separate from CI so that editing the title
# or description re-runs only this.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: attribution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  attribution:
    name: no AI attribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: scripts/test-check-attribution
        run: scripts/test-check-attribution
      - name: scripts/check-attribution
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: scripts/check-attribution "$BASE" "$HEAD"
